<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{/layouts/head}">
    <title>Gia hạn thời gian thuê phòng</title>
</head>
<style>
    /* Modern Color Palette */
    :root {
        --primary: #4361ee;
        --primary-hover: #3a56d4;
        --secondary: #6c757d;
        --secondary-hover: #5a6268;
        --success: #28a745;
        --danger: #dc3545;
        --light: #f8f9fa;
        --dark: #343a40;
        --border-radius: 0.375rem;
        --box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
        --transition: all 0.3s ease;
    }

    /* Base Styles */
    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background-color: #f5f7fa;
        color: #333;
        line-height: 1.6;
    }

    .container-guest {
        max-width: 800px;
        margin: 2rem auto;
        padding: 0 20px;
    }

    /* Header Styles */
    .page-title-guest {
        color: var(--dark);
        margin-bottom: 1.5rem;
        font-weight: 700;
        font-size: 1.75rem;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .page-title-guest i {
        color: var(--primary);
        font-size: 1.5rem;
    }

    /* Card Styles */
    .card {
        background: white;
        border-radius: var(--border-radius);
        box-shadow: var(--box-shadow);
        padding: 1.75rem;
        margin-bottom: 2rem;
        border: none;
        transition: var(--transition);
    }

    .card:hover {
        box-shadow: 0 0.75rem 1.5rem rgba(0, 0, 0, 0.1);
    }

    .card-header {
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        padding-bottom: 1rem;
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .card-header h4 {
        color: var(--dark);
        margin: 0;
        font-weight: 600;
        font-size: 1.25rem;
    }

    .card-header i {
        color: var(--primary);
        font-size: 1.25rem;
    }

    /* Contract Info Styles */
    .contract-details-guest {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .contract-details-guest li {
        padding: 0.75rem 0;
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        display: flex;
        align-items: center;
    }

    .contract-details-guest li:last-child {
        border-bottom: none;
    }

    .contract-details-guest strong {
        min-width: 140px;
        display: inline-block;
        color: var(--secondary);
        font-weight: 500;
    }

    /* Form Styles */
    .extend-form-guest {
        margin-top: 2rem;
    }

    .form-group-guest {
        margin-bottom: 1.5rem;
    }

    .form-label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: var(--dark);
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.95rem;
    }

    .form-label i {
        color: var(--primary);
        width: 20px;
        text-align: center;
        font-size: 1rem;
    }

    .required:after {
        content: " *";
        color: var(--danger);
    }

    .form-control {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid #ced4da;
        border-radius: var(--border-radius);
        font-size: 1rem;
        transition: var(--transition);
        background-color: #fff;
    }

    .form-control:focus {
        color: #495057;
        background-color: #fff;
        border-color: #80bdff;
        outline: 0;
        box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
    }

    textarea.form-control {
        min-height: 120px;
        resize: vertical;
    }

    /* Button Styles */
    .form-actions-guest {
        display: flex;
        justify-content: flex-end;
        gap: 1rem;
        margin-top: 2rem;
    }

    .btn {
        padding: 0.75rem 1.5rem;
        border-radius: var(--border-radius);
        font-weight: 500;
        cursor: pointer;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        text-decoration: none;
        border: none;
        font-size: 1rem;
        line-height: 1.5;
    }

    .btn-primary {
        background-color: var(--primary);
        color: white;
    }

    .btn-primary:hover {
        background-color: var(--primary-hover);
        transform: translateY(-2px);
    }

    .btn-secondary {
        background-color: var(--secondary);
        color: white;
    }

    .btn-secondary:hover {
        background-color: var(--secondary-hover);
        transform: translateY(-2px);
    }

    /* Date Input Styles */
    .date-input-container {
        position: relative;
    }

    .date-input-container i {
        position: absolute;
        right: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--secondary);
        pointer-events: none;
    }

    /* Responsive Adjustments */
    @media (max-width: 768px) {
        .container-guest {
            padding: 0 15px;
        }

        .page-title-guest {
            font-size: 1.5rem;
        }

        .card {
            padding: 1.25rem;
        }

        .contract-details-guest li {
            flex-direction: column;
            align-items: flex-start;
        }

        .contract-details-guest strong {
            margin-bottom: 0.25rem;
            min-width: auto;
        }

        .form-actions-guest {
            flex-direction: column;
        }

        .btn {
            width: 100%;
        }
    }

    /* Animation */
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .card {
        animation: fadeIn 0.5s ease-out;
    }

    /* Validation Styles */
    .is-invalid {
        border-color: var(--danger);
    }

    .invalid-feedback {
        color: var(--danger);
        font-size: 0.875rem;
        margin-top: 0.25rem;
    }
</style>

<body>
    <div th:replace="~{/layouts/navbar}"></div>
    <div class="container-guest">
        <h2 class="page-title-guest">
            <i class="fas fa-calendar-plus"></i> Gửi yêu cầu gia hạn hợp đồng
        </h2>

        <!-- Contract Information Card -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-file-contract"></i>
                <h4>Thông tin hợp đồng hiện tại</h4>
            </div>
            <ul class="contract-details-guest">
                <li>
                    <strong>Phòng:</strong>
                    <span th:text="${contract?.room?.namerooms}">Phòng</span>
                </li>
                <li>
                    <strong>Địa chỉ:</strong>
                    <span th:if="${contract?.room?.hostel?.address != null}"
                        th:text="${contract.room.hostel.address}">Địa chỉ</span>
                </li>
                <li>
                    <strong>Ngày bắt đầu:</strong>
                    <span th:text="${#dates.format(contract?.startDate, 'dd/MM/yyyy')}">01/01/2024</span>
                </li>
                <li>
                    <strong>Ngày kết thúc:</strong>
                    <span th:text="${#dates.format(contract?.endDate, 'dd/MM/yyyy')}">31/12/2024</span>
                </li>
                <li>
                    <strong>Giá thuê:</strong>
                    <span th:text="${#numbers.formatDecimal(contract?.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ/tháng'">
                        1,000,000 VNĐ/tháng
                    </span>
                </li>
            </ul>
        </div>

        <!-- Extension Request Form Card -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-edit"></i>
                <h4>Yêu cầu gia hạn</h4>
            </div>

            <form th:action="@{/khach-thue/gia-han/{id}(id=${contract?.contractId})}" method="post"
                class="extend-form-guest">
                <div class="form-group-guest">
                    <label for="requestedExtendDate" class="form-label required">
                        <i class="fas fa-calendar-day"></i> Ngày kết thúc mong muốn
                    </label>
                    <div class="date-input-container">
                        <input type="date" id="requestedExtendDate" name="requestedExtendDate" class="form-control"
                            required th:min="${#dates.format(#dates.createToday(), 'yyyy-MM-dd')}" />
                    </div>
                    <div class="invalid-feedback">Vui lòng chọn ngày kết thúc hợp lệ</div>
                </div>

                <div class="form-group-guest">
                    <label for="message" class="form-label">
                        <i class="fas fa-comment-alt"></i> Lời nhắn cho chủ nhà
                    </label>
                    <textarea id="message" name="message" rows="4" class="form-control"
                        placeholder="Xin hãy chia sẻ lý do bạn muốn gia hạn hợp đồng (không bắt buộc)..."></textarea>
                </div>

                <div class="form-actions-guest">
                    <a th:href="@{/khach-thue/chitiet-phongthue/{id}(id=${contract?.contractId})}"
                        class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Quay lại
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-paper-plane"></i> Gửi yêu cầu
                    </button>
                </div>
            </form>
        </div>
    </div>
    <div th:replace="~{/layouts/footer}"></div>
</body>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const dateInput = document.getElementById("requestedExtendDate");
        if (dateInput) {
            // Lấy ngày hôm nay
            const today = new Date();

            // Cộng thêm 30 ngày
            const futureDate = new Date();
            futureDate.setDate(today.getDate() + 30);

            const yyyy = futureDate.getFullYear();
            const mm = String(futureDate.getMonth() + 1).padStart(2, '0');
            const dd = String(futureDate.getDate()).padStart(2, '0');
            const minDateStr = `${yyyy}-${mm}-${dd}`;

            // Set min date = hôm nay + 30 ngày
            dateInput.setAttribute("min", minDateStr);

            // Nếu người dùng nhập nhỏ hơn minDate → reset lại
            dateInput.addEventListener("change", function () {
                if (dateInput.value < minDateStr) {
                    alert("Vui lòng chọn ngày kết thúc ít nhất sau 30 ngày kể từ hôm nay!");
                    dateInput.value = minDateStr;
                }
            });
        }

        // Form validation
        const form = document.querySelector(".extend-form-guest");
        if (form) {
            form.addEventListener("submit", function (e) {
                let isValid = true;

                // Validate date
                if (!dateInput.value) {
                    dateInput.classList.add("is-invalid");
                    isValid = false;
                } else {
                    dateInput.classList.remove("is-invalid");
                }

                if (!isValid) {
                    e.preventDefault();
                    // Scroll to first invalid field
                    const firstInvalid = form.querySelector(".is-invalid");
                    if (firstInvalid) {
                        firstInvalid.scrollIntoView({
                            behavior: "smooth",
                            block: "center"
                        });
                    }
                }
            });
        }
    });
</script>

</html>
