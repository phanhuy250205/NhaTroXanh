<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sự Cố - Nhà Trọ Xanh</title>
    <link rel="icon" th:href="@{/images/logo/nhatroxanh(title).png}" type="image/x-icon" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <style>
        :root {
            --primary-color: #3e83cc;
            --primary-light: #e8f2ff;
            --primary-dark: #2c6ba0;
            --success-color: #28a745;
            --info-color: #17a2b8;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --light-bg: #f8f9fa;
            --white: #ffffff;
            --gray-100: #f8f9fa;
            --gray-200: #e9ecef;
            --gray-300: #dee2e6;
            --gray-600: #6c757d;
            --gray-800: #343a40;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-medium: 0 4px 20px rgba(0, 0, 0, 0.08);
            --border-radius: 10px;
            --border-radius-lg: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f5f7f9;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            min-height: 100vh;
            line-height: 1.6;
            color: var(--gray-800);
            font-size: 0.95rem;
            padding: 0;
        }

        .app-container {
            display: flex;
            min-height: 100vh;
        }

        .main-content {
            flex: 1;
            padding: 2rem;
            transition: var(--transition);
        }

        .header-section-host {
            background: white;
            padding: 1.75rem 2rem;
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            margin-bottom: 1.5rem;
            border: none;
            position: relative;
            overflow: hidden;
            border-left: 4px solid var(--primary-color);
        }

        .header-section-host::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="white" opacity="0.1"/><circle cx="75" cy="75" r="1" fill="white" opacity="0.1"/><circle cx="50" cy="10" r="0.5" fill="white" opacity="0.1"/><circle cx="10" cy="60" r="0.5" fill="white" opacity="0.1"/><circle cx="90" cy="40" r="0.5" fill="white" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
            pointer-events: none;
        }

        .header-title-host {
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--gray-800);
        }

        .header-title-host i {
            color: var(--primary-color);
            background: var(--primary-light);
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .header-description {
            color: var(--gray-600);
            margin-top: 0.5rem;
            font-size: 1rem;
        }

        /* Action bar */
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .btn-back {
            background: white;
            color: var(--primary-color);
            padding: 0.75rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 500;
            border: 1px solid var(--gray-300);
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--card-shadow);
        }

        .btn-back:hover {
            background: var(--primary-light);
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        /* Search box */
        .search-container {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-form {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: nowrap;
        }

        .search-input {
            flex: 1;
            border: 2px solid var(--gray-200);
            border-radius: var(--border-radius);
            padding: 0.75rem 1.25rem;
            font-size: 1rem;
            transition: var(--transition);
            background: var(--white);
        }

        .search-input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 0.2rem rgba(62, 131, 204, 0.15);
        }

        .btn-search {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            border: none;
            border-radius: var(--border-radius);
            padding: 0.75rem 1.5rem;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-search {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            border: none;
            border-radius: var(--border-radius);
            padding: 0.75rem 1.5rem;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-search:hover {
            background: linear-gradient(135deg, var(--primary-dark) 0%, #1e4f73 100%);
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
        }

        /* Stats cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--white);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            border-left: 4px solid var(--primary-color);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .stat-card.pending {
            border-left-color: var(--warning-color);
        }

        .stat-card.processing {
            border-left-color: var(--info-color);
        }

        .stat-card.resolved {
            border-left-color: var(--success-color);
        }

        .stat-title {
            font-size: 0.9rem;
            color: var(--gray-600);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-dark);
        }

        .stat-card.pending .stat-value {
            color: var(--warning-color);
        }

        .stat-card.processing .stat-value {
            color: var(--info-color);
        }

        .stat-card.resolved .stat-value {
            color: var(--success-color);
        }

        /* Table */
        .table-container {
            background: var(--white);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--card-shadow);
            margin-bottom: 2rem;
        }

        .table-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
        }

        .table-header th {
            border: none;
            padding: 1.25rem 1.5rem;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            vertical-align: middle;
        }

        .table tbody tr {
            transition: var(--transition);
            border-bottom: 1px solid var(--gray-200);
        }

        .table tbody tr:hover {
            background: linear-gradient(90deg, rgba(62, 131, 204, 0.03) 0%, rgba(62, 131, 204, 0.08) 50%, rgba(62, 131, 204, 0.03) 100%);
        }

        .table td {
            padding: 1.25rem 1.5rem;
            vertical-align: middle;
            border: none;
            font-size: 0.9rem;
            color: var(--gray-800);
        }

        /* Badges */
        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .status-processed {
            background: linear-gradient(135deg, var(--success-color) 0%, #1e7e34 100%);
            color: white;
        }

        .status-processing {
            background: linear-gradient(135deg, var(--info-color) 0%, #117a8b 100%);
            color: white;
        }

        .status-pending {
            background: linear-gradient(135deg, var(--warning-color) 0%, #e0a800 100%);
            color: #212529;
        }

        .priority-badge {
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .priority-high {
            background: linear-gradient(135deg, var(--danger-color) 0%, #bd2130 100%);
            color: white;
        }

        .priority-medium {
            background: linear-gradient(135deg, var(--warning-color) 0%, #e0a800 100%);
            color: #212529;
        }

        .priority-low {
            background: linear-gradient(135deg, var(--gray-600) 0%, #545b62 100%);
            color: white;
        }

        .btn-detail {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            border: none;
            border-radius: var(--border-radius);
            padding: 0.45rem 1rem;
            color: white;
            font-size: 0.85rem;
            font-weight: 500;
            transition: var(--transition);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn-detail:hover {
            background: linear-gradient(135deg, var(--primary-dark) 0%, #1e4f73 100%);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        /* Pagination */
        .pagination-container {
            display: flex;
            justify-content: center;
            margin-top: 2rem;
        }

        .page-link {
            color: var(--primary-color);
            border: 1px solid rgba(62, 131, 204, 0.2);
            border-radius: var(--border-radius);
            margin: 0 0.2rem;
            padding: 0.5rem 0.9rem;
            transition: var(--transition);
            font-weight: 500;
            background: var(--white);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            font-size: 0.9rem;
        }

        .page-link:hover {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .page-item.active .page-link {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            border-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Responsive styles */
        @media (max-width: 1200px) {
            .sidebar {
                width: 220px;
            }

            .main-content {
                margin-left: 220px;
            }
        }

        @media (max-width: 992px) {
            .sidebar {
                width: 80px;
                padding: 1rem 0.5rem;
            }

            .sidebar-logo span {
                display: none;
            }

            .nav-link span {
                display: none;
            }

            .nav-link {
                justify-content: center;
                padding: 1rem 0.5rem;
            }

            .nav-link i {
                font-size: 1.25rem;
            }

            .main-content {
                margin-left: 80px;
                padding: 1.5rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                width: 260px;
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
                padding: 1.25rem;
            }

            .action-bar {
                flex-direction: column;
                align-items: flex-start;
            }

            .search-container {
                width: 100%;
            }

            .search-input {
                min-width: unset;
            }

            .menu-toggle {
                display: block !important;
            }
        }

        @media (max-width: 576px) {
            .main-content {
                padding: 1rem;
            }

            .header-section-host {
                padding: 1.5rem 1.25rem;
            }

            .header-title-host {
                font-size: 1.5rem;
            }

            .header-title-host i {
                width: 40px;
                height: 40px;
                font-size: 1.25rem;
            }

            .table-header th,
            .table td {
                padding: 1rem 0.75rem;
            }

            .btn-detail {
                padding: 0.5rem 0.75rem;
                font-size: 0.8rem;
            }
        }

        .menu-toggle {
            display: none;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            padding: 0.5rem 0.75rem;
            font-size: 1.25rem;
        }
    </style>
</head>

<body>
    <div th:replace="~{/layouts/sidebar-host}"></div>

    <div class="app-container">
        <div class="main-content">
            <div class="header-section-host">
                <h1 class="header-title-host">
                    <i class="fas fa-tools"></i>Quản lý khiếu nại và sự cố
                </h1>
                <p class="header-description">Theo dõi và xử lý các khiếu nại, sự cố từ khách thuê</p>
            </div>
            <div class="action-bar">
                <button type="button" onclick="goBack()" class="btn-back">
                    <i class="fas fa-arrow-left"></i> Quay lại
                </button>

                <div class="search-container">
                    <form th:action="@{/chu-tro/quan-ly-su-co}" method="get" class="search-form">
                        <input type="text" class="search-input" name="search" th:value="${search}"
                            placeholder="Tìm kiếm theo tên, loại sự cố, khu trọ...">
                        <button type="submit" class="btn-search">
                            <i class="fas fa-search me-1"></i> Tìm kiếm
                        </button>

                        <input type="hidden" name="page" th:value="${currentPage}">
                        <input type="hidden" name="size" th:value="${pageSize}">
                        <input type="hidden" name="status" id="statusParam" th:value="${status}">
                        <input type="hidden" name="priority" id="priorityParam" th:value="${priority}">
                    </form>
                </div>

            </div>
            <!-- Incident List Table -->
            <div class="table-container">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-header">
                            <tr>
                                <th>NGƯỜI GỬI</th>
                                <th>LOẠI SỰ CỐ</th>
                                <th>MỨC ĐỘ</th>
                                <th>KHU TRỌ</th>
                                <th>THỜI GIAN</th>
                                <th>TRẠNG THÁI</th>
                                <th>HÀNH ĐỘNG</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="incident : ${incidents}">
                                <td>
                                    <div class="d-flex align-items-center">
                                        <div class="flex-shrink-0">
                                            <i class="fas fa-user-circle me-2" style="color: #6c757d;"></i>
                                        </div>
                                        <div class="flex-grow-1 ms-2">
                                            <span th:text="${incident.user.fullname}"></span>
                                        </div>
                                    </div>
                                </td>
                                <td th:text="${incident.incidentType}"></td>
                                <td>
                                    <span
                                        th:classappend="
                                        ${incident.level.name() == 'CAO'} ? ' priority-badge priority-high' :
                                        (${incident.level.name() == 'TRUNG_BINH'} ? ' priority-badge priority-medium' : ' priority-badge priority-low')"
                                        class="priority-badge-host">
                                        <i class="fas fa-circle"></i>
                                        <span th:switch="${incident.level.name()}">
                                            <span th:case="'CAO'">Cao</span>
                                            <span th:case="'TRUNG_BINH'">Trung bình</span>
                                            <span th:case="'THAP'">Thấp</span>
                                        </span>
                                    </span>
                                </td>
                                <td th:text="${incident.room.hostel.name}"></td>
                                <td th:text="${#dates.format(incident.reportedAt, 'dd/MM/yyyy HH:mm')}"></td>
                                <td>
                                    <span
                                        th:classappend="
                                        ${incident.status.name() == 'DA_XU_LY'} ? 'status-badge status-processed' : 
                                        (${incident.status.name() == 'DANG_XU_LY'} ? 'status-badge status-processing' : 'status-badge status-pending')"
                                        class="status-badge-host">
                                        <i
                                            th:class="
                                            ${incident.status.name() == 'DA_XU_LY'} ? 'fas fa-check' : 
                                            (${incident.status.name() == 'DANG_XU_LY'} ? 'fas fa-cogs' : 'fas fa-clock')"></i>
                                        <span th:switch="${incident.status.name()}">
                                            <span th:case="'CHUA_XU_LY'">Chưa xử lý</span>
                                            <span th:case="'DANG_XU_LY'">Đang xử lý</span>
                                            <span th:case="'DA_XU_LY'">Đã xử lý</span>
                                        </span>
                                    </span>
                                </td>
                                <td>
                                    <a th:href="@{/chu-tro/quan-ly-su-co/{id}(id=${incident.reportId},search=${search},page=${currentPage},status=${status},priority=${priority})}"
                                        class="btn-detail">
                                        <i class="fas fa-eye me-1"></i> Xem chi tiết
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(incidents)}">
                                <td colspan="7" class="text-center py-4">
                                    <i class="fas fa-inbox me-2" style="font-size: 1.5rem; color: #dee2e6;"></i>
                                    <p class="mt-2 mb-0">Không tìm thấy khiếu nại nào.</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Pagination -->
            <div class="pagination-container" th:if="${totalPages > 1}">
                <nav aria-label="Page navigation">
                    <ul class="pagination">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link"
                                th:href="@{/chu-tro/quan-ly-su-co(search=${search},page=${currentPage - 1},size=${pageSize},status=${status},priority=${priority})}">
                                &laquo;
                            </a>
                        </li>
                        <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${i == currentPage} ? 'active'" class="page-item">
                            <a class="page-link"
                                th:href="@{/chu-tro/quan-ly-su-co(search=${search},page=${i},size=${pageSize},status=${status},priority=${priority})}"
                                th:text="${i + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link"
                                th:href="@{/chu-tro/quan-ly-su-co(search=${search},page=${currentPage + 1},size=${pageSize},status=${status},priority=${priority})}">
                                &raquo;
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <script>
        function goBack() {
            window.history.back();
        }

        // Menu toggle for mobile
        document.addEventListener('DOMContentLoaded', function () {
            const menuToggle = document.getElementById('menuToggle');
            const sidebar = document.querySelector('.sidebar');

            if (menuToggle) {
                menuToggle.addEventListener('click', function () {
                    sidebar.classList.toggle('active');
                });
            }
        });
    </script>
    <script src="/js/sidebar.js"></script>
</body>

</html>
