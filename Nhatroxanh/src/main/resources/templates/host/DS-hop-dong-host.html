  <!DOCTYPE html>
  <html lang="en">

  <head th:replace="~{/layouts/head}">
    <title>Chi Tiết - Nhà Trọ Xanh</title>
  </head>

  <body>
  <!-- NAVBAR -->
  <div th:replace="~{/layouts/sidebar-host}"></div>
  <div class="main-content">
    <h5 class="fw-bold mb-4">Danh sách hợp đồng</h5>

    <!-- Thống kê hợp đồng -->
    <div class="row g-3 host-stats">
      <div class="col-md-6 col-xl-3">
        <div class="host-card-stat host-stat-blue">
          <div class="host-stat-icon"><i class="fa fa-file-alt"></i></div>
          <div class="host-stat-text">
            <div class="host-stat-label">Tổng hợp đồng</div>
            <div class="host-stat-number" id="total-contracts">0</div>
          </div>
        </div>
      </div>
      <div class="col-md-6 col-xl-3">
        <div class="host-card-stat host-stat-green">
          <div class="host-stat-icon"><i class="fa fa-check-circle"></i></div>
          <div class="host-stat-text">
            <div class="host-stat-label">Đang hoạt động</div>
            <div class="host-stat-number" id="active-contracts">0</div>
          </div>
        </div>
      </div>
      <div class="col-md-6 col-xl-3">
        <div class="host-card-stat host-stat-yellow">
          <div class="host-stat-icon"><i class="fa fa-edit"></i></div>
          <div class="host-stat-text">
            <div class="host-stat-label">Bản nháp</div>
            <div class="host-stat-number" id="draft-contracts">0</div>
          </div>
        </div>
      </div>
      <div class="col-md-6 col-xl-3">
        <div class="host-card-stat host-stat-orange"> <!-- Đổi từ purple sang orange -->
          <div class="host-stat-icon"><i class="fa fa-clock"></i></div> <!-- Đổi icon -->
          <div class="host-stat-text">
            <div class="host-stat-label">Sắp hết hạn</div> <!-- Đổi label -->
            <div class="host-stat-number" id="expired-contracts">0</div> <!-- Đổi id -->
          </div>
        </div>
      </div>
      <!-- Thêm card mới cho TERMINATED -->
      <div class="col-md-6 col-xl-3">
        <div class="host-card-stat host-stat-red">
          <div class="host-stat-icon"><i class="fa fa-times-circle"></i></div>
          <div class="host-stat-text">
            <div class="host-stat-label">Đã chấm dứt</div>
            <div class="host-stat-number" id="terminated-contracts">0</div>
          </div>
        </div>
      </div>
    </div>


    <div class="search-section">
      <div class="search-input-group">
        <input type="text" class="search-input" id="searchInput"
               placeholder="Tìm kiếm theo số điện thoại hoặc tên phòng...">
        <button type="button" class="search-btn" id="searchBtn" onclick="searchContracts()">
          <i class="fas fa-search"></i>
        </button>
        <button type="button" class="search-btn" id="clearSearchBtn" onclick="clearSearch()" style="display: none;">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>

    <!-- Search Results Info -->
    <div class="search-results-info" id="searchResultsInfo" style="display: none;">
      <i class="fas fa-info-circle me-2"></i>
      <span id="resultsCount">Tìm thấy 0 hợp đồng</span>
    </div>

    <!-- Loading spinner -->
    <div id="loading" class="text-center mt-4">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Đang tải...</span>
      </div>
    </div>

    <!-- Danh sách hợp đồng -->
    <div class="card mt-4 shadow-sm host-contract-table" id="contracts-table" style="display: none;">
      <div class="card-header d-flex justify-content-between align-items-center bg-white">
        <h6 class="mb-0 fw-bold">Danh sách các hợp đồng cho thuê</h6>
        <a href="/chu-tro/hop-dong">
          <button class="btn btn-sm btn-outline-primary">
            <i class="fa fa-plus-circle"></i> Hợp đồng mới
          </button>
        </a>
      </div>
      <div class="table-responsive">
        <table class="table table-bordered mb-0 text-center">
          <thead class="table-light">
          <tr>
            <th>MÃ SỐ HĐ</th>
            <th>NGƯỜI THUÊ</th>
            <th>PHÒNG</th>
            <th>NGÀY BẮT ĐẦU</th>
            <th>NGÀY KẾT THÚC</th>
            <th>SỐ ĐIỆN THOẠI</th>
            <th>TRẠNG THÁI</th>
            <th>HÀNH ĐỘNG</th>
          </tr>
          </thead>
          <tbody id="contracts-tbody">
          <!-- Dữ liệu sẽ được load bằng JavaScript -->
          </tbody>
        </table>
      </div>
      <div class="card-footer d-flex justify-content-between">
        <small id="pagination-info">Hiển thị 0 đến 0 trong số 0 hợp đồng</small>
        <nav>
          <ul class="pagination pagination-sm mb-0" id="pagination">
            <!-- Pagination sẽ được tạo bằng JavaScript -->
          </ul>
        </nav>
      </div>
    </div>
  </div>

  <script>
    // 🌟 ===== BIẾN TOÀN CỤC VÀ CẤU HÌNH =====
    let currentPage = 0;
    let currentSize = 5;
    let isSearching = false;
    let searchQuery = '';

    // 🎯 ===== CẤU HÌNH STATUS =====
    const CONTRACT_STATUS = {
      DRAFT: {
        label: 'Bản nháp',
        badgeClass: 'bg-secondary',
        iconClass: 'fa-edit',
        canEdit: true,
        description: 'Hợp đồng đang được soạn thảo'
      },
      ACTIVE: {
        label: 'Đang hoạt động',
        badgeClass: 'bg-success',
        iconClass: 'fa-check-circle',
        canEdit: false,
        description: 'Hợp đồng đang có hiệu lực'
      },
      EXPIRED: {
        label: 'Sắp hết hạn',
        badgeClass: 'bg-warning text-dark',
        iconClass: 'fa-clock',
        canEdit: true,
        description: 'Hợp đồng sắp hết hạn, cần gia hạn'
      },
      TERMINATED: {
        label: 'Đã chấm dứt',
        badgeClass: 'bg-danger',
        iconClass: 'fa-times-circle',
        canEdit: false,
        description: 'Hợp đồng đã kết thúc'
      }
    };

    // 🚀 ===== HÀM TIỆN ÍCH =====

    // Hàm debounce để tối ưu hóa tìm kiếm
    function debounce(func, wait) {
      let timeout;
      return function (...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }

    // Hiển thị/ẩn loading
    function showLoading(show = true) {
      const loadingElement = document.getElementById('loading');
      const contractsTable = document.getElementById('contracts-table');

      if (loadingElement && contractsTable) {
        loadingElement.style.display = show ? 'block' : 'none';
        contractsTable.style.display = show ? 'none' : 'block';
      }
    }

    // Hiển thị thông báo lỗi
    function showError(message) {
      const toast = document.createElement('div');
      toast.className = 'alert alert-danger position-fixed';
      toast.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px; animation: slideInRight 0.3s ease-out;';
      toast.innerHTML = `
        <i class="fa fa-exclamation-circle"></i> ${message}
        <button type="button" class="btn-close float-end" onclick="this.parentElement.remove()"></button>
      `;
      document.body.appendChild(toast);

      setTimeout(() => {
        if (toast.parentElement) {
          toast.remove();
        }
      }, 5000);
    }

    // Hiển thị thông báo thành công
    function showSuccessMessage(message) {
      const toast = document.createElement('div');
      toast.className = 'alert alert-success position-fixed';
      toast.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px; animation: slideInRight 0.3s ease-out;';
      toast.innerHTML = `
        <i class="fa fa-check-circle"></i> ${message}
        <button type="button" class="btn-close float-end" onclick="this.parentElement.remove()"></button>
      `;
      document.body.appendChild(toast);

      setTimeout(() => {
        if (toast.parentElement) {
          toast.remove();
        }
      }, 5000);
    }

    // Format ngày tháng an toàn
    function formatDate(dateString) {
      if (!dateString) return '<span class="text-muted">Chưa có</span>';

      try {
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return '<span class="text-muted">Không hợp lệ</span>';

        return date.toLocaleDateString('vi-VN', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric'
        });
      } catch (error) {
        console.error('❌ Error formatting date:', error);
        return '<span class="text-danger">Lỗi định dạng</span>';
      }
    }

    // 🎯 ===== HÀM XỬ LÝ STATUS =====

    // Lấy thông tin status
    function getStatusInfo(status) {
      return CONTRACT_STATUS[status] || {
        label: status || 'Không xác định',
        badgeClass: 'bg-secondary',
        iconClass: 'fa-question',
        canEdit: false,
        description: 'Trạng thái không xác định'
      };
    }

    // ✅ Kiểm tra có thể chỉnh sửa hợp đồng - ĐÃ SỬA
    function canEditContract(contract) {
      if (!contract || typeof contract !== 'object' || !contract.status) {
        return false;
      }

      let status = contract.status;

      // ✅ Kiểm tra ngày để xác định status thực tế
      if (status === 'ACTIVE' && contract.endDate) {
        const today = new Date();
        const endDate = new Date(contract.endDate);
        const daysRemaining = Math.ceil((endDate - today) / (1000 * 60 * 60 * 24));

        if (daysRemaining <= 3) {
          status = 'EXPIRED'; // Cho phép edit
        }
      }

      const statusInfo = getStatusInfo(status);
      return statusInfo.canEdit;
    }

    // ✅ Hiển thị trạng thái dưới dạng badge - ĐÃ SỬA
    function getStatusBadge(contract, showIcon = true) {
      let status = contract.status;

      // ✅ KIỂM TRA NGÀY TRƯỚC KHI HIỂN THỊ
      if (status === 'ACTIVE' && contract.endDate) {
        const today = new Date();
        const endDate = new Date(contract.endDate);
        const daysRemaining = Math.ceil((endDate - today) / (1000 * 60 * 60 * 24));

        // 🚨 Nếu còn <= 3 ngày thì chuyển thành EXPIRED
        if (daysRemaining <= 3) {
          status = 'EXPIRED';
        }
      }

      const statusInfo = getStatusInfo(status);
      const icon = showIcon ? `<i class="fa ${statusInfo.iconClass} me-1"></i>` : '';

      return `<span class="badge ${statusInfo.badgeClass}" title="${statusInfo.description}">
        ${icon}${statusInfo.label}
      </span>`;
    }

    // ✅ Tạo nút edit với logic khóa/mở - ĐÃ SỬA
    function getEditButton(contract) {
      if (!contract.contractId) {
        return '<span class="text-muted">N/A</span>';
      }

      let status = contract.status;

      // ✅ Kiểm tra ngày để xác định status thực tế
      if (status === 'ACTIVE' && contract.endDate) {
        const today = new Date();
        const endDate = new Date(contract.endDate);
        const daysRemaining = Math.ceil((endDate - today) / (1000 * 60 * 60 * 24));

        if (daysRemaining <= 3) {
          status = 'EXPIRED';
        }
      }

      const statusInfo = getStatusInfo(status);

      if (statusInfo.canEdit) {
        return `
          <button class="btn btn-sm btn-outline-primary"
                  onclick="editContract(${contract.contractId})"
                  title="Chỉnh sửa hợp đồng">
            <i class="fa fa-pen"></i>
          </button>
        `;
      } else {
        const tooltipText = getEditTooltip(status);
        return `
          <button class="btn btn-sm btn-secondary"
                  disabled
                  title="${tooltipText}"
                  data-bs-toggle="tooltip">
            <i class="fa fa-lock"></i>
          </button>
        `;
      }
    }

    // Lấy tooltip cho nút edit bị khóa
    function getEditTooltip(status) {
      const tooltips = {
        'ACTIVE': 'Hợp đồng đang hoạt động không thể chỉnh sửa',
        'TERMINATED': 'Hợp đồng đã chấm dứt không thể chỉnh sửa'
      };

      return tooltips[status] || 'Không thể chỉnh sửa hợp đồng này';
    }

    // Lấy class CSS cho hàng trong bảng
    function getRowClass(status) {
      const rowClasses = {
        'EXPIRED': 'table-warning', // Sắp hết hạn - màu vàng
        'TERMINATED': 'table-danger', // Đã chấm dứt - màu đỏ nhạt
        'DRAFT': 'table-secondary' // Bản nháp - màu xám nhạt
      };

      return rowClasses[status] || '';
    }

    // 🌟 ===== HÀM LOAD DỮ LIỆU =====

    // Load thống kê hợp đồng (đơn giản hóa)
    async function loadContractStats() {
      try {
        const response = await fetch('/api/contracts/count-by-status', {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + localStorage.getItem('token')
          }
        });

        if (!response.ok) {
          throw new Error('Không thể tải thống kê hợp đồng');
        }

        const data = await response.json();

        if (data.success) {
          updateStats(data.statusCounts); // Trực tiếp dùng data từ backend
        } else {
          showError(data.message || 'Không thể tải thống kê hợp đồng');
        }
      } catch (error) {
        console.error('❌ Error loading contract stats:', error);
        showError('Lỗi kết nối khi tải thống kê. Vui lòng thử lại sau.');
      }
    }

    // Cập nhật thống kê với hiệu ứng đếm số
    function updateStats(statusCounts) {
      try {
        const total = Object.values(statusCounts || {}).reduce((sum, count) => sum + (count || 0), 0);

        // Mapping ID elements với status
        const statusElements = {
          'total-contracts': total,
          'active-contracts': statusCounts?.ACTIVE || 0,
          'draft-contracts': statusCounts?.DRAFT || 0,
          'expired-contracts': statusCounts?.EXPIRED || 0,
          'terminated-contracts': statusCounts?.TERMINATED || 0
        };

        // Cập nhật từng element với hiệu ứng
        Object.entries(statusElements).forEach(([elementId, value]) => {
          const element = document.getElementById(elementId);
          if (element) {
            animateNumber(element, parseInt(element.textContent) || 0, value, 500);
          }
        });

        console.log('✅ Stats updated successfully:', statusElements);
      } catch (error) {
        console.error('❌ Error updating stats:', error);
      }
    }

    // Hiệu ứng đếm số cho thống kê
    function animateNumber(element, start, end, duration) {
      if (start === end) {
        element.textContent = end;
        return;
      }

      const range = end - start;
      const increment = range / (duration / 16); // 60fps
      let current = start;

      const timer = setInterval(() => {
        current += increment;
        if ((increment > 0 && current >= end) || (increment < 0 && current <= end)) {
          current = end;
          clearInterval(timer);
        }
        element.textContent = Math.round(current);
      }, 16);
    }

    // Load danh sách hợp đồng
    async function loadContracts(page = 0, size = 5) {
      try {
        showLoading(true);
        currentPage = page;
        currentSize = size;

        const response = await fetch(`/api/contracts/list?page=${page}&size=${size}`, {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + localStorage.getItem('token')
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();

        if (data.success) {
          isSearching = false;
          hideSearchInfo();
          displayContracts(data.contracts);
          updatePagination(data.totalContracts, data.totalPages, data.currentPage, size, false);
        } else {
          showError(data.message || 'Không thể tải dữ liệu hợp đồng');
        }
      } catch (error) {
        console.error('❌ Error loading contracts:', error);
        showError('Lỗi kết nối. Vui lòng thử lại sau.');
      } finally {
        showLoading(false);
      }
    }

    // 🔍 ===== HÀM TÌM KIẾM =====

    // Tìm kiếm hợp đồng
    async function searchContracts(page = 0, size = 5) {
      const input = document.getElementById('searchInput').value.trim();
      if (!input) {
        showError('Vui lòng nhập số điện thoại hoặc tên phòng để tìm kiếm');
        return;
      }

      try {
        showLoading(true);
        currentPage = page;
        currentSize = size;
        searchQuery = input;

        const params = new URLSearchParams();
        const isPhone = /^\d+$/.test(input);

        if (isPhone) {
          params.append('phone', input);
        } else {
          params.append('roomName', input);
        }
        params.append('page', page);
        params.append('size', size);

        const response = await fetch(`/api/contracts/search?${params.toString()}`, {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + localStorage.getItem('token')
          }
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.message || `HTTP error! status: ${response.status}`);
        }

        const data = await response.json();

        if (data.success) {
          isSearching = true;
          showSearchInfo(data.totalContracts);
          displayContracts(data.contracts);
          updatePagination(data.totalContracts, data.totalPages, data.currentPage, size, true);
        } else {
          showError(data.message || 'Không thể tải dữ liệu hợp đồng');
          hideSearchInfo();
        }
      } catch (error) {
        console.error('❌ Error searching contracts:', error);
        showError(error.message || 'Lỗi kết nối khi tìm kiếm hợp đồng. Vui lòng thử lại sau.');
        hideSearchInfo();
      } finally {
        showLoading(false);
      }
    }

    // Hiển thị thông tin tìm kiếm
    function showSearchInfo(totalResults) {
      const resultsInfo = document.getElementById('searchResultsInfo');
      const resultsCount = document.getElementById('resultsCount');
      const clearBtn = document.getElementById('clearSearchBtn');

      if (resultsInfo && resultsCount) {
        resultsInfo.style.display = 'block';
        resultsCount.textContent = `Tìm thấy ${totalResults} hợp đồng`;
      }

      if (clearBtn) {
        clearBtn.style.display = 'block';
      }
    }

    // Ẩn thông tin tìm kiếm
    function hideSearchInfo() {
      const resultsInfo = document.getElementById('searchResultsInfo');
      const clearBtn = document.getElementById('clearSearchBtn');

      if (resultsInfo) resultsInfo.style.display = 'none';
      if (clearBtn) clearBtn.style.display = 'none';
    }

    // Xóa tìm kiếm
    function clearSearch() {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = '';
      }

      isSearching = false;
      searchQuery = '';
      hideSearchInfo();
      loadContracts(0, 5);
    }

    // 🎨 ===== HÀM HIỂN THỊ GIAO DIỆN =====

    // ✅ Hiển thị danh sách hợp đồng - ĐÃ SỬA
    function displayContracts(contracts) {
      const tbody = document.getElementById('contracts-tbody');
      if (!tbody) {
        console.error('❌ Contracts table body not found');
        showError('Không tìm thấy bảng hợp đồng');
        return;
      }

      if (!contracts || contracts.length === 0) {
        tbody.innerHTML = `
        <tr>
          <td colspan="8" class="text-center text-muted py-5">
            <i class="fa fa-inbox fa-3x mb-3 d-block"></i>
            <h5>Không có hợp đồng nào</h5>
            <p class="mb-0">Chưa có dữ liệu hợp đồng để hiển thị</p>
          </td>
        </tr>
      `;
        return;
      }

      tbody.innerHTML = contracts.map((contract, index) => {
        if (!contract || typeof contract !== 'object') {
          console.warn('⚠️ Invalid contract object:', contract);
          return '';
        }

        try {
          const canEdit = canEditContract(contract);

          return `
          <tr data-contract-id="${contract.contractId}">
            <td>
              <strong class="text-primary">#${contract.contractId || 'N/A'}</strong>
            </td>
            <td>
              <div class="d-flex align-items-center">
                <div class="avatar-sm bg-light rounded-circle me-2 d-flex align-items-center justify-content-center">
                  <i class="fa fa-user text-muted"></i>
                </div>
                <span>${contract.tenantName || 'N/A'}</span>
              </div>
            </td>
            <td>
              <span class="badge bg-light text-dark">
                <i class="fa fa-home me-1"></i>${contract.roomName || 'N/A'}
              </span>
            </td>
            <td>
              <strong>${formatDate(contract.startDate)}</strong>
            </td>
            <td>
              <small class="text-muted d-block">Kết thúc</small>
              <strong>${formatDate(contract.endDate)}</strong>
            </td>
            <td>
              <a href="tel:${contract.tenantPhone || ''}" class="text-decoration-none">
                <i class="fa fa-phone text-success me-1"></i>
                ${contract.tenantPhone || 'N/A'}
              </a>
            </td>
            <td>
              ${getStatusBadge(contract, true)}
              ${!canEdit ? '<br><small class="text-muted mt-1"><i class="fa fa-lock me-1"></i>Khóa</small>' : ''}
            </td>
            <td>
              ${getEditButton(contract)}
            </td>
          </tr>
        `;
        } catch (error) {
          console.error('❌ Error rendering contract row:', error, contract);
          return `
          <tr class="table-danger">
            <td colspan="8" class="text-center py-3">
              <i class="fa fa-exclamation-triangle text-danger me-2"></i>
              <strong>Lỗi hiển thị hợp đồng ID: ${contract?.contractId || 'Unknown'}</strong>
              <br><small class="text-muted">${error.message}</small>
            </td>
          </tr>
        `;
        }
      }).join('');

      // Hiển thị bảng và khởi tạo tooltips
      document.getElementById('contracts-table').style.display = 'block';
      initializeTooltips();

      console.log(`✅ Displayed ${contracts.length} contracts successfully`);
    }


    // Khởi tạo tooltips Bootstrap
    function initializeTooltips() {
      setTimeout(() => {
        if (typeof bootstrap !== 'undefined' && bootstrap.Tooltip) {
          // Xóa tooltips cũ
          document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => {
            const existingTooltip = bootstrap.Tooltip.getInstance(el);
            if (existingTooltip) {
              existingTooltip.dispose();
            }
          });

          // Tạo tooltips mới
          const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
          tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl, {
              placement: 'top',
              trigger: 'hover'
            });
          });
        }
      }, 100);
    }

    // Cập nhật pagination
    function updatePagination(totalContracts, totalPages, currentPageFromServer, size, isSearchMode = false) {
      const pagination = document.getElementById('pagination');
      const paginationInfo = document.getElementById('pagination-info');

      if (!pagination || !paginationInfo) {
        console.error('❌ Pagination elements not found');
        return;
      }

      // Cập nhật thông tin hiển thị
      const start = currentPageFromServer * size + 1;
      const end = Math.min((currentPageFromServer + 1) * size, totalContracts);
      paginationInfo.textContent = `Hiển thị ${start} đến ${end} trong số ${totalContracts} hợp đồng`;

      // Xóa pagination cũ
      pagination.innerHTML = '';

      if (totalPages <= 1) return;

      // Nút Previous
      if (currentPageFromServer > 0) {
        pagination.innerHTML += `
          <li class="page-item">
            <a class="page-link" href="#" onclick="${isSearchMode ? `searchContracts(${currentPageFromServer - 1}, ${size})` : `loadContracts(${currentPageFromServer - 1}, ${size})`}; return false;">Trước</a>
          </li>
        `;
      } else {
        pagination.innerHTML += `
          <li class="page-item disabled">
            <span class="page-link">Trước</span>
          </li>
        `;
      }

      // Các trang số
      const maxVisiblePages = 5;
      let startPage = Math.max(0, currentPageFromServer - Math.floor(maxVisiblePages / 2));
      let endPage = Math.min(totalPages - 1, startPage + maxVisiblePages - 1);

      if (endPage - startPage < maxVisiblePages - 1) {
        startPage = Math.max(0, endPage - maxVisiblePages + 1);
      }

      for (let i = startPage; i <= endPage; i++) {
        pagination.innerHTML += `
          <li class="page-item ${i === currentPageFromServer ? 'active' : ''}">
            <a class="page-link" href="#" onclick="${isSearchMode ? `searchContracts(${i}, ${size})` : `loadContracts(${i}, ${size})`}; return false;">${i + 1}</a>
          </li>
        `;
      }

      // Nút Next
      if (currentPageFromServer < totalPages - 1) {
        pagination.innerHTML += `
          <li class="page-item">
            <a class="page-link" href="#" onclick="${isSearchMode ? `searchContracts(${currentPageFromServer + 1}, ${size})` : `loadContracts(${currentPageFromServer + 1}, ${size})`}; return false;">Sau</a>
          </li>
        `;
      } else {
        pagination.innerHTML += `
          <li class="page-item disabled">
            <span class="page-link">Sau</span>
          </li>
        `;
      }
    }

    // 🔧 ===== HÀM CẬP NHẬT DỮ LIỆU =====

    // Hàm xem chi tiết hợp đồng
    function viewContract(contractId) {
      if (contractId) {
        window.open(`/chu-tro/hop-dong/view/${contractId}`, '_blank');
      } else {
        showError('ID hợp đồng không hợp lệ');
      }
    }

    // Chỉnh sửa hợp đồng
    function editContract(contractId) {
      console.log('🔧 Editing contract:', contractId);
      if (contractId) {
        window.location.href = `/chu-tro/hop-dong/edit/${contractId}`;
      } else {
        showError('ID hợp đồng không hợp lệ');
      }
    }

    // 🚀 ===== KHỞI TẠO TRANG =====

    document.addEventListener('DOMContentLoaded', function() {
      console.log('🚀 Initializing contract management page with perfect status handling...');

      // Load dữ liệu ban đầu
      loadContractStats();
      loadContracts(0, 5);

      // Thiết lập tìm kiếm
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        const debouncedSearch = debounce(function() {
          const input = searchInput.value.trim();
          if (input) {
            searchContracts(0, 5);
          } else {
            clearSearch();
          }
        }, 500);

        searchInput.addEventListener('input', debouncedSearch);

        // Xử lý Enter key
        searchInput.addEventListener('keypress', function(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            const input = this.value.trim();
            if (input) {
              searchContracts(0, 5);
            }
          }
        });
      }

      console.log('✅ Contract management page initialized successfully with status:', Object.keys(CONTRACT_STATUS));
    });

    // 🔄 ===== HÀM XỬ LÝ SỰ KIỆN =====

    // Xử lý nút tìm kiếm
    function handleSearchButton() {
      const input = document.getElementById('searchInput').value.trim();
      if (input) {
        searchContracts(0, 5);
      } else {
        showError('Vui lòng nhập từ khóa tìm kiếm');
      }
    }

    // 🌟 ===== EXPORT GLOBAL FUNCTIONS =====
    window.searchContracts = searchContracts;
    window.clearSearch = clearSearch;
    window.loadContracts = loadContracts;
    window.editContract = editContract;
    window.viewContract = viewContract;
    window.getStatusInfo = getStatusInfo;
    window.CONTRACT_STATUS = CONTRACT_STATUS;

  </script>
