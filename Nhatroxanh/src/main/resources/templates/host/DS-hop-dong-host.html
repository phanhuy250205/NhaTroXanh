<!DOCTYPE html>
<html lang="en">

<head th:replace="~{/layouts/head}">
  <title>Chi Tiết - Nhà Trọ Xanh</title>
</head>

<body>
<!-- NAVBAR -->
<div th:replace="~{/layouts/sidebar-host}"></div>
<div class="main-content">
  <h5 class="fw-bold mb-4">Danh sách hợp đồng</h5>

  <!-- Thống kê hợp đồng -->
  <div class="row g-3 host-stats">
    <div class="col-md-6 col-xl-3">
      <div class="host-card-stat host-stat-blue">
        <div class="host-stat-icon"><i class="fa fa-file-alt"></i></div>
        <div class="host-stat-text">
          <div class="host-stat-label">Tổng hợp đồng</div>
          <div class="host-stat-number" id="total-contracts">0</div>
        </div>
      </div>
    </div>
    <div class="col-md-6 col-xl-3">
      <div class="host-card-stat host-stat-green">
        <div class="host-stat-icon"><i class="fa fa-check-circle"></i></div>
        <div class="host-stat-text">
          <div class="host-stat-label">Đang hoạt động</div>
          <div class="host-stat-number" id="active-contracts">0</div>
        </div>
      </div>
    </div>
    <div class="col-md-6 col-xl-3">
      <div class="host-card-stat host-stat-yellow">
        <div class="host-stat-icon"><i class="fa fa-edit"></i></div>
        <div class="host-stat-text">
          <div class="host-stat-label">Bản nháp</div>
          <div class="host-stat-number" id="draft-contracts">0</div>
        </div>
      </div>
    </div>
    <div class="col-md-6 col-xl-3">
      <div class="host-card-stat host-stat-purple">
        <div class="host-stat-icon"><i class="fa fa-calendar-times"></i></div>
        <div class="host-stat-text">
          <div class="host-stat-label">Sắp Hết Hạn</div>
          <div class="host-stat-number" id="expiring-contracts">0</div>
        </div>
      </div>
    </div>
  </div>

  <div class="search-section">
    <div class="search-input-group">
      <input type="text" class="search-input" id="searchInput"
             placeholder="Tìm kiếm theo số điện thoại hoặc tên phòng...">
      <button type="button" class="search-btn" id="searchBtn" onclick="searchContracts()">
        <i class="fas fa-search"></i>
      </button>
      <button type="button" class="search-btn" id="clearSearchBtn" onclick="clearSearch()" style="display: none;">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </div>

  <!-- Search Results Info -->
  <div class="search-results-info" id="searchResultsInfo" style="display: none;">
    <i class="fas fa-info-circle me-2"></i>
    <span id="resultsCount">Tìm thấy 0 hợp đồng</span>
  </div>

  <!-- Loading spinner -->
  <div id="loading" class="text-center mt-4">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Đang tải...</span>
    </div>
  </div>

  <!-- Danh sách hợp đồng -->
  <div class="card mt-4 shadow-sm host-contract-table" id="contracts-table" style="display: none;">
    <div class="card-header d-flex justify-content-between align-items-center bg-white">
      <h6 class="mb-0 fw-bold">Danh sách các hợp đồng cho thuê</h6>
      <a href="/chu-tro/hop-dong">
        <button class="btn btn-sm btn-outline-primary">
          <i class="fa fa-plus-circle"></i> Hợp đồng mới
        </button>
      </a>
    </div>
    <div class="table-responsive">
      <table class="table table-bordered mb-0 text-center">
        <thead class="table-light">
        <tr>
          <th>MÃ SỐ HĐ</th>
          <th>NGƯỜI THUÊ</th>
          <th>PHÒNG</th>
          <th>NGÀY BẮT ĐẦU</th>
          <th>NGÀY KẾT THÚC</th>
          <th>SỐ ĐIỆN THOẠI</th>
          <th>TRẠNG THÁI</th>
          <th>HÀNH ĐỘNG</th>
        </tr>
        </thead>
        <tbody id="contracts-tbody">
        <!-- Dữ liệu sẽ được load bằng JavaScript -->
        </tbody>
      </table>
    </div>
    <div class="card-footer d-flex justify-content-between">
      <small id="pagination-info">Hiển thị 0 đến 0 trong số 0 hợp đồng</small>
      <nav>
        <ul class="pagination pagination-sm mb-0" id="pagination">
          <!-- Pagination sẽ được tạo bằng JavaScript -->
        </ul>
      </nav>
    </div>
  </div>
</div>

<script>
  // 🌟 ===== BIẾN TOÀN CỤC VÀ CẤU HÌNH =====
  let currentPage = 0;
  let currentSize = 5;
  let isSearching = false;
  let searchQuery = '';

  // 🚀 ===== HÀM TIỆN ÍCH =====

  // Hàm debounce để tối ưu hóa tìm kiếm
  function debounce(func, wait) {
    let timeout;
    return function (...args) {
      clearTimeout(timeout);
      timeout = setTimeout(() => func.apply(this, args), wait);
    };
  }

  // Hiển thị/ẩn loading
  function showLoading(show = true) {
    const loadingElement = document.getElementById('loading');
    const contractsTable = document.getElementById('contracts-table');

    if (loadingElement && contractsTable) {
      loadingElement.style.display = show ? 'block' : 'none';
      contractsTable.style.display = show ? 'none' : 'block';
    }
  }

  // Hiển thị thông báo lỗi
  function showError(message) {
    const toast = document.createElement('div');
    toast.className = 'alert alert-danger position-fixed';
    toast.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px; animation: slideInRight 0.3s ease-out;';
    toast.innerHTML = `
    <i class="fa fa-exclamation-circle"></i> ${message}
    <button type="button" class="btn-close float-end" onclick="this.parentElement.remove()"></button>
  `;
    document.body.appendChild(toast);

    setTimeout(() => {
      if (toast.parentElement) {
        toast.remove();
      }
    }, 5000);
  }

  // Hiển thị thông báo thành công
  function showSuccessMessage(message) {
    const toast = document.createElement('div');
    toast.className = 'alert alert-success position-fixed';
    toast.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px; animation: slideInRight 0.3s ease-out;';
    toast.innerHTML = `
    <i class="fa fa-check-circle"></i> ${message}
    <button type="button" class="btn-close float-end" onclick="this.parentElement.remove()"></button>
  `;
    document.body.appendChild(toast);

    setTimeout(() => {
      if (toast.parentElement) {
        toast.remove();
      }
    }, 5000);
  }

  // Format ngày tháng
  function formatDate(dateString) {
    if (!dateString) return 'N/A';
    try {
      const date = new Date(dateString);
      if (isNaN(date.getTime())) return 'N/A';
      return date.toLocaleDateString('vi-VN', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      });
    } catch (error) {
      console.error('Error formatting date:', error);
      return 'N/A';
    }
  }

  // Kiểm tra hợp đồng sắp hết hạn
  function isExpiringSoon(endDate) {
    if (!endDate) return false;
    try {
      const today = new Date();
      const end = new Date(endDate);
      if (isNaN(end.getTime())) return false;

      const daysUntilExpiry = Math.ceil((end - today) / (1000 * 60 * 60 * 24));
      return daysUntilExpiry <= 3 && daysUntilExpiry > 0;
    } catch (error) {
      console.error('Error checking expiry date:', error);
      return false;
    }
  }

  // Kiểm tra có thể chỉnh sửa hợp đồng
  function canEditContract(contract) {
    if (!contract || typeof contract !== 'object') {
      return false;
    }

    // Nếu hợp đồng không phải ACTIVE thì có thể edit
    if (contract.status !== 'ACTIVE') {
      return true;
    }

    // Nếu hợp đồng ACTIVE và sắp hết hạn thì có thể edit
    if (contract.status === 'ACTIVE' && isExpiringSoon(contract.endDate)) {
      return true;
    }

    return false;
  }

  // 🌟 ===== HÀM LOAD DỮ LIỆU =====

  // Sửa hàm loadContractStats
  async function loadContractStats() {
    try {
      const [statusResponse, contractsResponse] = await Promise.all([
        fetch('/api/contracts/count-by-status', {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + localStorage.getItem('token')
          }
        }),
        // Lấy tất cả hợp đồng để tính sắp hết hạn
        fetch('/api/contracts/list?page=0&size=1000', {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + localStorage.getItem('token')
          }
        })
      ]);

      if (!statusResponse.ok || !contractsResponse.ok) {
        throw new Error('Không thể tải thống kê hợp đồng');
      }

      const statusData = await statusResponse.json();
      const contractsData = await contractsResponse.json();

      if (statusData.success && contractsData.success) {
        // Tính số hợp đồng sắp hết hạn
        const expiringCount = calculateExpiringSoonCount(contractsData.contracts);
        updateStats(statusData.statusCounts, expiringCount);
      } else {
        showError(statusData.message || contractsData.message || 'Không thể tải thống kê hợp đồng');
      }
    } catch (error) {
      console.error('Error loading contract stats:', error);
      showError('Lỗi kết nối khi tải thống kê. Vui lòng thử lại sau.');
    }
  }

  // Sửa hàm calculateExpiringSoonCount để khớp với logic hiển thị
  function calculateExpiringSoonCount(contracts, days = 30) {
    if (!contracts || !Array.isArray(contracts)) {
      return 0;
    }

    return contracts.filter(contract => {
      // Kiểm tra theo trạng thái từ backend
      if (contract.status === 'TERMINATED') return true;

      // HOẶC tính theo ngày (tùy logic của bạn)
      if (contract.status === 'ACTIVE') {
        return isExpiringSoon(contract.endDate, 30);
      }

      return false;
    }).length;
  }



  // Cập nhật thống kê
  function updateStats(statusCounts, expiringCount) {
    try {
      const total = Object.values(statusCounts || {}).reduce((sum, count) => sum + count, 0);

      const elements = {
        total: document.getElementById('total-contracts'),
        active: document.getElementById('active-contracts'),
        draft: document.getElementById('draft-contracts'),
        expiring: document.getElementById('expiring-contracts')
      };

      if (elements.total) elements.total.textContent = total;
      if (elements.active) elements.active.textContent = statusCounts?.ACTIVE || 0;
      if (elements.draft) elements.draft.textContent = statusCounts?.DRAFT || 0;
      if (elements.expiring) elements.expiring.textContent = expiringCount || 0;
    } catch (error) {
      console.error('Error updating stats:', error);
    }
  }

  // Load danh sách hợp đồng
  async function loadContracts(page = 0, size = 5) {
    try {
      showLoading(true);
      currentPage = page;
      currentSize = size;

      const response = await fetch(`/api/contracts/list?page=${page}&size=${size}`, {
        method: 'GET',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + localStorage.getItem('token')
        }
      });

      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }

      const data = await response.json();

      if (data.success) {
        isSearching = false;
        hideSearchInfo();
        displayContracts(data.contracts);
        updatePagination(data.totalContracts, data.totalPages, data.currentPage, size, false);
      } else {
        showError(data.message || 'Không thể tải dữ liệu hợp đồng');
      }
    } catch (error) {
      console.error('Error loading contracts:', error);
      showError('Lỗi kết nối. Vui lòng thử lại sau.');
    } finally {
      showLoading(false);
    }
  }

  // 🔍 ===== HÀM TÌM KIẾM =====

  // Tìm kiếm hợp đồng
  async function searchContracts(page = 0, size = 5) {
    const input = document.getElementById('searchInput').value.trim();
    if (!input) {
      showError('Vui lòng nhập số điện thoại hoặc tên phòng để tìm kiếm');
      return;
    }

    try {
      showLoading(true);
      currentPage = page;
      currentSize = size;
      searchQuery = input;

      const params = new URLSearchParams();
      const isPhone = /^\d+$/.test(input);

      if (isPhone) {
        params.append('phone', input);
      } else {
        params.append('roomName', input);
      }
      params.append('page', page);
      params.append('size', size);

      const response = await fetch(`/api/contracts/search?${params.toString()}`, {
        method: 'GET',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + localStorage.getItem('token')
        }
      });

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.message || `HTTP error! status: ${response.status}`);
      }

      const data = await response.json();

      if (data.success) {
        isSearching = true;
        showSearchInfo(data.totalContracts);
        displayContracts(data.contracts);
        updatePagination(data.totalContracts, data.totalPages, data.currentPage, size, true);
      } else {
        showError(data.message || 'Không thể tải dữ liệu hợp đồng');
        hideSearchInfo();
      }
    } catch (error) {
      console.error('Error searching contracts:', error);
      showError(error.message || 'Lỗi kết nối khi tìm kiếm hợp đồng. Vui lòng thử lại sau.');
      hideSearchInfo();
    } finally {
      showLoading(false);
    }
  }

  // Hiển thị thông tin tìm kiếm
  function showSearchInfo(totalResults) {
    const resultsInfo = document.getElementById('searchResultsInfo');
    const resultsCount = document.getElementById('resultsCount');
    const clearBtn = document.getElementById('clearSearchBtn');

    if (resultsInfo && resultsCount) {
      resultsInfo.style.display = 'block';
      resultsCount.textContent = `Tìm thấy ${totalResults} hợp đồng`;
    }

    if (clearBtn) {
      clearBtn.style.display = 'block';
    }
  }

  // Ẩn thông tin tìm kiếm
  function hideSearchInfo() {
    const resultsInfo = document.getElementById('searchResultsInfo');
    const clearBtn = document.getElementById('clearSearchBtn');

    if (resultsInfo) resultsInfo.style.display = 'none';
    if (clearBtn) clearBtn.style.display = 'none';
  }

  // Xóa tìm kiếm
  function clearSearch() {
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
      searchInput.value = '';
    }

    isSearching = false;
    searchQuery = '';
    hideSearchInfo();
    loadContracts(0, 5);
  }

  // 🎨 ===== HÀM HIỂN THỊ GIAO DIỆN =====


  // Hiển thị trạng thái dưới dạng badge (không thể chỉnh sửa)
  function getStatusBadge(status) {
    const statusConfig = {
      'DRAFT': { label: 'Bản nháp', class: 'bg-secondary' },
      'ACTIVE': { label: 'Đang thuê', class: 'bg-success' },
      'TERMINATED': { label: 'Sắp Hết Hạn', class: 'bg-danger' },
      'EXPIRED': { label: 'Hết hạn', class: 'bg-warning text-dark' }
    };

    const config = statusConfig[status] || { label: status, class: 'bg-secondary' };

    return `<span class="badge ${config.class}">${config.label}</span>`;
  }

  // Tạo nút edit với logic khóa/mở
  function getEditButton(contractId, canEdit, status, isExpiring) {
    if (!contractId) {
      return '<span class="text-muted">N/A</span>';
    }

    if (canEdit) {
      return `
      <button class="btn btn-sm btn-outline-primary"
              onclick="editContract(${contractId})"
              title="Chỉnh sửa hợp đồng">
        <i class="fa fa-pen"></i>
      </button>
    `;
    } else {
      const tooltipText = status === 'ACTIVE' && !isExpiring
              ? 'Hợp đồng đang hoạt động không thể chỉnh sửa. Chỉ có thể chỉnh sửa khi sắp hết hạn (3 ngày trước).'
              : 'Không thể chỉnh sửa hợp đồng này';

      return `
      <button class="btn btn-sm btn-secondary"
              disabled
              title="${tooltipText}"
              data-bs-toggle="tooltip">
        <i class="fa fa-lock"></i>
      </button>
    `;
    }
  }

  // Hiển thị danh sách hợp đồng
  function displayContracts(contracts) {
    const tbody = document.getElementById('contracts-tbody');
    if (!tbody) {
      console.error('Contracts table body not found');
      showError('Không tìm thấy bảng hợp đồng');
      return;
    }

    if (!contracts || contracts.length === 0) {
      tbody.innerHTML = `
      <tr>
        <td colspan="8" class="text-center text-muted py-4">
          <i class="fa fa-inbox fa-2x mb-2"></i><br>
          Không có hợp đồng nào
        </td>
      </tr>
    `;
      return;
    }

    tbody.innerHTML = contracts.map(contract => {
      if (!contract || typeof contract !== 'object') {
        console.warn('Invalid contract object:', contract);
        return '';
      }

      try {
        const canEdit = canEditContract(contract);
        const isExpiring = isExpiringSoon(contract.endDate);

        return `
        <tr ${isExpiring ? 'class="table-warning"' : ''}>
          <td><strong>${contract.contractId || 'N/A'}</strong></td>
          <td>${contract.tenantName || 'N/A'}</td>
          <td>${contract.roomName || 'N/A'}</td>
          <td>${formatDate(contract.startDate)}</td>
          <td>
            ${formatDate(contract.endDate)}
            ${isExpiring ? '<br><small class="text-danger"><i class="fa fa-exclamation-triangle"></i> Sắp hết hạn</small>' : ''}
          </td>
          <td>${contract.tenantPhone || 'N/A'}</td>
          <td>
            ${getStatusBadge(contract.status)}
            ${!canEdit ? '<br><small class="text-muted mt-1"><i class="fa fa-lock"></i></small>' : ''}
          </td>
          <td>${getEditButton(contract.contractId, canEdit, contract.status, isExpiring)}</td>
        </tr>
      `;
      } catch (error) {
        console.error('Error rendering contract row:', error, contract);
        return `
        <tr>
          <td colspan="8" class="text-danger text-center">
            <i class="fa fa-exclamation-triangle"></i>
            Lỗi hiển thị hợp đồng ID: ${contract?.contractId || 'Unknown'}
          </td>
        </tr>
      `;
      }
    }).join('');

    document.getElementById('contracts-table').style.display = 'block';

    // Khởi tạo tooltips nếu có Bootstrap
    setTimeout(() => {
      if (typeof bootstrap !== 'undefined' && bootstrap.Tooltip) {
        const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        tooltipTriggerList.map(function (tooltipTriggerEl) {
          return new bootstrap.Tooltip(tooltipTriggerEl);
        });
      }
    }, 100);
  }

  // Cập nhật pagination
  function updatePagination(totalContracts, totalPages, currentPageFromServer, size, isSearchMode = false) {
    const pagination = document.getElementById('pagination');
    const paginationInfo = document.getElementById('pagination-info');

    if (!pagination || !paginationInfo) {
      console.error('Pagination elements not found');
      return;
    }

    // Cập nhật thông tin hiển thị
    const start = currentPageFromServer * size + 1;
    const end = Math.min((currentPageFromServer + 1) * size, totalContracts);
    paginationInfo.textContent = `Hiển thị ${start} đến ${end} trong số ${totalContracts} hợp đồng`;

    // Xóa pagination cũ
    pagination.innerHTML = '';

    if (totalPages <= 1) return;

    // Nút Previous
    if (currentPageFromServer > 0) {
      pagination.innerHTML += `
      <li class="page-item">
        <a class="page-link" href="#" onclick="${isSearchMode ? `searchContracts(${currentPageFromServer - 1}, ${size})` : `loadContracts(${currentPageFromServer - 1}, ${size})`}; return false;">Trước</a>
      </li>
    `;
    } else {
      pagination.innerHTML += `
      <li class="page-item disabled">
        <span class="page-link">Trước</span>
      </li>
    `;
    }

    // Các trang số
    const maxVisiblePages = 5;
    let startPage = Math.max(0, currentPageFromServer - Math.floor(maxVisiblePages / 2));
    let endPage = Math.min(totalPages - 1, startPage + maxVisiblePages - 1);

    if (endPage - startPage < maxVisiblePages - 1) {
      startPage = Math.max(0, endPage - maxVisiblePages + 1);
    }

    for (let i = startPage; i <= endPage; i++) {
      pagination.innerHTML += `
      <li class="page-item ${i === currentPageFromServer ? 'active' : ''}">
        <a class="page-link" href="#" onclick="${isSearchMode ? `searchContracts(${i}, ${size})` : `loadContracts(${i}, ${size})`}; return false;">${i + 1}</a>
      </li>
    `;
    }

    // Nút Next
    if (currentPageFromServer < totalPages - 1) {
      pagination.innerHTML += `
      <li class="page-item">
        <a class="page-link" href="#" onclick="${isSearchMode ? `searchContracts(${currentPageFromServer + 1}, ${size})` : `loadContracts(${currentPageFromServer + 1}, ${size})`}; return false;">Sau</a>
      </li>
    `;
    } else {
      pagination.innerHTML += `
      <li class="page-item disabled">
        <span class="page-link">Sau</span>
      </li>
    `;
    }
  }

  // 🔧 ===== HÀM CẬP NHẬT DỮ LIỆU =====

  // Chỉnh sửa hợp đồng
  function editContract(contractId) {
    console.log('🔍 Editing contract:', contractId);
    if (contractId) {
      window.location.href = `/chu-tro/hop-dong/edit/${contractId}`;
    } else {
      showError('ID hợp đồng không hợp lệ');
    }
  }

  // 🚀 ===== KHỞI TẠO TRANG =====

  document.addEventListener('DOMContentLoaded', function() {
    console.log('🚀 Initializing contract management page...');

    // Load dữ liệu ban đầu
    loadContractStats();
    loadContracts(0, 5);

    // Thiết lập tìm kiếm
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
      const debouncedSearch = debounce(function() {
        const input = searchInput.value.trim();
        if (input) {
          searchContracts(0, 5);
        } else {
          clearSearch();
        }
      }, 500);

      searchInput.addEventListener('input', debouncedSearch);

      // Xử lý Enter key
      searchInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          const input = this.value.trim();
          if (input) {
            searchContracts(0, 5);
          }
        }
      });
    }

    console.log('✅ Contract management page initialized successfully');
